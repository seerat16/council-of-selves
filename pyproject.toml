[project]
name = "council-of-selves"
version = "0.1.0"
description = "Convene your past selves, each rebuilt from only what you knew at the time, to deliberate on a decision. Cognee time-sliced memory + ClawMax agent team."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee>=1.6,<1.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "python-dotenv>=1.0",
    "anthropic>=0.39",
    "jinja2>=3.1",
]

[project.scripts]
selves = "brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[tool.ruff]
line-length = 100
target-version = "py311"
